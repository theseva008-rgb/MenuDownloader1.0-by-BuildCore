name: Build2
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Fix settings and build
        run: |
          printf "pluginManagement {\n  repositories {\n    maven { url = 'https://maven.%s/' }\n    gradlePluginPortal()\n    mavenCentral()\n  }\n}\nrootProject.name = 'MenuDownloader'\n" "fabricmc.net" > settings.gradle
          gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: MenuDownloader
          path: build/libs/*.jar
