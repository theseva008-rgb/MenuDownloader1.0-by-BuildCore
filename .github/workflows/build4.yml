name: Build4
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'
      - name: Patch 1.21.11 API and build
        run: |
          printf "pluginManagement {\n  repositories {\n    maven { url = 'https://maven.%s/' }\n    gradlePluginPortal()\n    mavenCentral()\n  }\n}\nrootProject.name = 'MenuDownloader'\n" "fabricmc.net" > settings.gradle
          sed -i 's/entry.getProfile().getName()/entry.getProfile().name()/g' src/main/java/dev/menudownloader/dumpers/TabDumper.java
          python3 -c '
p = "src/main/java/dev/menudownloader/screens/MenuDownloaderPanelScreen.java"
s = open(p).read()
s = s.replace("import net.minecraft.client.gui.screen.Screen;", "import net.minecraft.client.gui.Click;\nimport net.minecraft.client.gui.screen.Screen;")
s = s.replace("public boolean mouseClicked(double mouseX, double mouseY, int button)", "public boolean mouseClicked(Click click, boolean doubled)")
s = s.replace("if (button != 0) return super.mouseClicked(mouseX, mouseY, button);", "double mouseX = click.x(); double mouseY = click.y(); if (click.button() != 0) return super.mouseClicked(click, doubled);")
s = s.replace("super.mouseClicked(mouseX, mouseY, button)", "super.mouseClicked(click, doubled)")
open(p, "w").write(s)
'
          gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: MenuDownloader
          path: build/libs/*.jar
